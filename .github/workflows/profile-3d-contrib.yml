name: 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"   # once a day (18:00 UTC)
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}   # personal access token, not the default token
          USERNAME: neagsom229-lang
          MAX_REPOS: 300
      - name: Commit output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "Update 3D contribution calendar" || echo "no changes"
          git push
