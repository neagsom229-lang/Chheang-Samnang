<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1e"/>
      <stop offset="0.5" stop-color="#161129"/>
      <stop offset="1" stop-color="#0d0b1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- guide lines -->
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#2a2440" stroke-width="1"/>
  <line x1="0" y1="234" x2="1200" y2="234" stroke="#2a2440" stroke-width="1"/>
  <line x1="600" y1="46" x2="600" y2="234" stroke="#2a2440" stroke-width="1" stroke-dasharray="2 6"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- meta labels -->
  <text x="30" y="30" class="mono" font-size="12" fill="#8a83a8" letter-spacing="1">&#x2387; main</text>
  <text x="30" y="256" class="mono" font-size="12" fill="#8a83a8" letter-spacing="1">khmerflow://samnang.dev</text>
  <text x="1170" y="256" text-anchor="end" class="mono" font-size="12" fill="#8a83a8" letter-spacing="1">v2.1.0</text>

  <!-- name -->
  <text x="30" y="122" font-size="46" font-weight="700" fill="#f1eefc" letter-spacing="0.5">Chheang Samnang</text>
  <text x="30" y="156" font-size="16" fill="#D946EF" letter-spacing="3" font-weight="600">JUNIOR WEB DEVELOPER · UI/UX DESIGNER</text>
  <text x="30" y="188" class="mono" font-size="14" fill="#8a83a8" letter-spacing="1">React · Django · Laravel · Flask · PostgreSQL</text>

  <!-- packet flow line -->
  <line x1="640" y1="204" x2="1140" y2="204" stroke="#2a2440" stroke-width="1"/>
  <text x="640" y="192" class="mono" font-size="10" fill="#8a83a8">POST /api/khqr/payment</text>
  <circle cx="640" cy="204" r="4" fill="#9333EA">
    <animate attributeName="cx" values="640;1140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="204" r="4" fill="#D946EF">
    <animate attributeName="cx" values="1140;640" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- request card -->
  <g>
    <rect x="640" y="72" width="220" height="76" rx="7" fill="#161129" stroke="#2a2440"/>
    <circle cx="660" cy="90" r="4" fill="#9333EA"/>
    <text x="674" y="95" class="mono" font-size="12" fill="#8a83a8">POST /api/khqr/payment</text>
    <rect x="658" y="108" width="120" height="6" rx="3" fill="#2a2440"/>
    <rect x="658" y="122" width="160" height="6" rx="3" fill="#2a2440"/>
    <text x="658" y="140" class="mono" font-size="11" fill="#58d9a6" opacity="0">
      200 OK &#183; KHQR verified &#183; 38ms
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- docs endpoint list -->
  <g>
    <rect x="890" y="72" width="280" height="76" rx="7" fill="#161129" stroke="#2a2440"/>
    <text x="908" y="94" class="mono" font-size="11" fill="#8a83a8" letter-spacing="1">API / ENDPOINTS</text>
    <text x="908" y="116" class="mono" font-size="12" fill="#58d9a6" opacity="0">
      GET    /v1/products
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.3;0.38" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="908" y="116" class="mono" font-size="12" fill="#58d9a6" opacity="0">
      POST   /v1/orders
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.3;0.38" dur="6s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="908" y="116" class="mono" font-size="12" fill="#58d9a6" opacity="0">
      PATCH  /v1/inventory
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.3;0.38" dur="6s" begin="4s" repeatCount="indefinite"/>
    </text>
    <rect x="908" y="128" width="0" height="6" rx="3" fill="#2a2440">
      <animate attributeName="width" values="0;244;244;0" keyTimes="0;0.7;0.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- project checklist -->
  <g>
    <text x="640" y="176" class="mono" font-size="12" fill="#8a83a8">&#x2610; KhmerFlow</text>
    <text x="790" y="176" class="mono" font-size="12" fill="#8a83a8">&#x2610; Obsidian</text>
    <text x="930" y="176" class="mono" font-size="12" fill="#8a83a8">&#x2610; TraceGeo</text>
    <text x="640" y="176" class="mono" font-size="12" fill="#D946EF" opacity="0">&#x2611; KhmerFlow
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.15;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="790" y="176" class="mono" font-size="12" fill="#D946EF" opacity="0">&#x2611; Obsidian
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.45;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="930" y="176" class="mono" font-size="12" fill="#D946EF" opacity="0">&#x2611; TraceGeo
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="1140" y="240" width="9" height="16" fill="#D946EF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
